<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: carlito, sans-serif;
            font-weight: 400;
            font-style: normal;

        }

        form {
            width: 60%;
            margin: auto;
            border: 2px solid #938585;
            padding: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #7b11de;
        }

        full-width {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 16px;
            border: 1px solid #938585;
            border-radius: 4px;
        }

        button {
            background-color: #7b11de;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5c3680;
        }
    </style>
</head>

<body>

    <! text,data,password,number,date,ratio,checkbox,select,submit>

        <form>
            <br>
            <label for="full-name">Full Name:</label>
            <input class="full-width" type="text" required id="full-name" name="full name" placeholder="Jane Doe">

            <br>
            <label for="email">Email:</label>
            <input class="full-width" type="email" required id="email" name="email" placeholder="jane@doe.com">
            <br>
            <label for="password">Password:</label>
            <input type="password" required id="password" name="password" placeholder="••••••••">

            <br>
            <label for="weight">Weight:</label>
            <input class="full-width" type="number" min="3" max="250" step="0.01" required id="weight" name="weight"
                placeholder="70">

            <br>
            <label for="dob">Date of Birth:</label>
            <input type="date" min="1940-01-01" max="2028-12-31" required id="dob" name="dob">

            <br>
            <label for="select gender">Select Gender:</label>
            <label for="m">male:</label>
            <input type="radio" id="m" name="gender" value="male">

            <br>
            <label for="f">female:</label>
            <input type="radio" id="f" name="gender" value="female">

            <hr>
            <label for="select your favourite food">Favourite Food:</label>
            <label for="x">pizza:</label>
            <input type="checkbox" id="x" name="food">

            <br>
            <label for="y">burger:</label>
            <input type="checkbox" id="y" name="food">

            <br>
            <label for="z">ugali:</label>
            <input type="checkbox" id="z" name="food">

            <br>
            <select>
                <option>Select a county
                </option>
                <option value="1">mombasa</option>
                <option value="2">nairobi</option>
                <option value="3">nyeri</option>
                <option value="4">kisumu</option>
                <option value="5">tharaka nithi</option>
            </select>


            <br>
            <button type="submit">Submit</button>


        </form>

</body>

</html>
